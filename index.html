<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 창원경일고 인성적성진로자기주도 검사 결과</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap');
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #242836;
  --border: #2e3347; --text: #e4e7f1; --text2: #8b90a5;
  --accent: #6c63ff; --accent2: #00d4aa; --accent3: #ff6b6b;
  --warn: #f59e0b; --blue: #3b82f6; --pink: #ec4899;
  --radius: 12px;
}
body.light-mode {
  --bg: #f0f2f7; --surface: #ffffff; --surface2: #f0f2f7;
  --border: #d1d5e0; --text: #1a1d27; --text2: #5a6075;
  --accent: #5a52e0; --accent2: #00a884; --accent3: #e05555;
  --warn: #d97706;
}
body.light-mode .header {
  background: linear-gradient(135deg,#ffffff 0%,#f0f2f7 100%);
}
body.light-mode .header h1 {
  background: linear-gradient(135deg,#5a52e0,#00a884);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
body.light-mode .profile-avatar {
  background: linear-gradient(135deg,#5a52e0,#00a884);
}
/* PDF / Print */
@media print {
  /* 기본 초기화 */
  *, *::before, *::after { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  @page { margin: 12mm 10mm; size: A4 portrait; }

  body {
    background: #ffffff !important;
    color: #1a1d27 !important;
    font-size: 11px !important;
    /* CSS 변수 전체 재정의 */
    --bg: #f8f9fc !important;
    --surface: #ffffff !important;
    --surface2: #f0f2f7 !important;
    --border: #d1d5e0 !important;
    --text: #1a1d27 !important;
    --text2: #5a6075 !important;
    --accent: #5a52e0 !important;
    --accent2: #00a884 !important;
    --accent3: #e05555 !important;
    --warn: #d97706 !important;
  }

  /* 헤더 */
  .header {
    background: #f8f9fc !important;
    border-bottom: 2px solid #5a52e0 !important;
    padding: 8px 16px !important;
    margin-bottom: 8px !important;
  }
  .header h1 {
    -webkit-text-fill-color: #5a52e0 !important;
    background: none !important;
    color: #5a52e0 !important;
    font-size: 15px !important;
  }
  .header-controls, .no-print { display: none !important; }

  /* 레이아웃 */
  .main { padding: 0 !important; max-width: 100% !important; }
  .grid-2 { grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
  .grid-3 { grid-template-columns: 1fr 1fr 1fr !important; gap: 8px !important; }

  /* 카드 */
  .card {
    background: #ffffff !important;
    border: 1px solid #d1d5e0 !important;
    border-radius: 8px !important;
    padding: 14px !important;
    margin-bottom: 10px !important;
    break-inside: avoid !important;
    page-break-inside: avoid !important;
  }
  .card-title { color: #5a52e0 !important; font-size: 12px !important; }

  /* 프로필 */
  .profile-avatar { background: #5a52e0 !important; }
  .profile-info h2 { color: #1a1d27 !important; font-size: 18px !important; }
  .profile-info p { color: #5a6075 !important; }

  /* 태그 */
  .tag { border: 1px solid #ccc !important; }
  .tag-type { color: #5a52e0 !important; background: #ede8ff !important; }
  .tag-interest { color: #006b5c !important; background: #e6f4f1 !important; }
  .tag-warn { color: #7a5900 !important; background: #fff3cd !important; }

  /* stat-box */
  .stat-box { background: #f0f2f7 !important; }
  .stat-box .label { color: #5a6075 !important; }
  .stat-box .value { color: #1a1d27 !important; }
  .value.high { color: #006b5c !important; }
  .value.mid  { color: #d97706 !important; }
  .value.low  { color: #c0392b !important; }

  /* 차트 영역 - canvas는 이미지로 대체 */
  .chart-wrap { height: 220px !important; }
  .chart-wrap canvas { display: none !important; }
  .chart-wrap .print-chart-img { display: block !important; width: 100% !important; height: 100% !important; object-fit: contain !important; }

  /* 막대그래프 (가로 진행률) - 배경색 강제 적용 */
  [style*="background:var(--surface2)"] { background: #f0f2f7 !important; }
  [style*="background:var(--bg)"] { background: #f8f9fc !important; }
  [style*="color:var(--text2)"] { color: #5a6075 !important; }
  [style*="color:var(--text)"] { color: #1a1d27 !important; }
  [style*="color:var(--accent)"] { color: #5a52e0 !important; }
  [style*="color:var(--accent2)"] { color: #00a884 !important; }
  [style*="color:var(--accent3)"] { color: #e05555 !important; }
  [style*="color:var(--warn)"] { color: #d97706 !important; }

  /* 학생부 박스 */
  .sbu-box {
    background: #f5f5f5 !important;
    color: #1a1d27 !important;
    max-height: none !important;
    overflow: visible !important;
    border: 1px solid #ddd !important;
  }

  /* 테이블 */
  .per-table td, .per-table th { color: #1a1d27 !important; border-color: #ddd !important; background: #fff !important; }
  .per-table th { background: #f0f2f7 !important; }
  .per-badge { border: 1px solid #ccc !important; color: #333 !important; background: #f0f2f7 !important; }
  .per-vhigh, .per-high { color: #006b5c !important; background: #e6f4f1 !important; }
  .per-mid { color: #3b2eb0 !important; background: #ede8ff !important; }
  .per-low { color: #7a5900 !important; background: #fff3cd !important; }
  .per-vlow { color: #8b0000 !important; background: #fde8e8 !important; }

  /* 타임라인 */
  .timeline { max-height: none !important; overflow: visible !important; }
  .tl-date,.tl-desc { color: #555 !important; }
  .tl-title { color: #1a1d27 !important; }
  .tl-dot.test { background: #5a52e0 !important; }
  .tl-dot.counsel { background: #00a884 !important; }

  /* 빈 상태 숨김 */
  .sdl-empty, .growth-empty { color: #666 !important; }

  /* 오버플로우 제거 */
  .timeline, .sbu-box { overflow: visible !important; max-height: none !important; }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* HEADER */
.header { background:linear-gradient(135deg,#1a1d27 0%,#242836 100%); border-bottom:1px solid var(--border); padding:16px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.header h1 { font-size:18px; font-weight:700; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; white-space:nowrap; }
.header-controls { display:flex; gap:8px; align-items:center; flex:1; min-width:300px; flex-wrap:wrap; }
.header-controls input { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:8px; font-size:13px; font-family:inherit; outline:none; transition:border .2s; }
.header-controls input:focus { border-color:var(--accent); }
#gasUrl { flex:1; min-width:200px; }
#studentId { width:120px; }
.btn { padding:8px 16px; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .2s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#5a52e0; transform:translateY(-1px); }
.btn-secondary { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.btn-secondary:hover { border-color:var(--accent); color:var(--text); }
.btn-green { background:#059669; color:#fff; }
.btn-green:hover { background:#047857; }

/* LAYOUT */
.main { max-width:1400px; margin:0 auto; padding:20px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:16px; }
@media(max-width:900px) { .grid-2,.grid-3 { grid-template-columns:1fr; } }

/* ── 모바일 세로 모드 대응 ── */
@media(max-width:600px) {
  /* 헤더 - 세로 전체폭 레이아웃 */
  .header { padding:10px 12px; gap:6px; flex-direction:column; align-items:stretch; }
  .header h1 { font-size:13px; white-space:normal; line-height:1.4; text-align:center; }
  .header-controls { flex-wrap:wrap; min-width:0; gap:6px; flex:none; width:100%; }
  .header-controls input { font-size:12px; padding:7px 10px; }
  /* 비밀번호: 전체폭 */
  #accessPw { flex:1 1 100%; min-width:0; width:100%; }
  /* 검색창 감싸는 div: 전체폭 */
  .header-controls > div[style*="position:relative"] { width:100%; flex:1 1 100%; }
  /* 검색 input: 전체폭 */
  #studentQuery { width:100%; min-width:0; box-sizing:border-box; }
  /* 조회/초기화 버튼: 나란히 */
  .btn { font-size:12px; padding:7px 12px; }
  .btn-primary { flex:1; }
  /* 🌙 테마, PDF 버튼은 모바일에서 숨김 */
  #themeBtn { display:none; }
  .btn[onclick="savePDF()"] { display:none; }

  /* 메인 패딩 */
  .main { padding:10px; }

  /* 카드 내부 2열 인라인 그리드 → 1열 */
  .card [style*="grid-template-columns:1fr 1fr"],
  .card [style*="grid-template-columns: 1fr 1fr"],
  .inner-grid-2 {
    grid-template-columns: 1fr !important;
  }

  /* 차트 높이 축소 */
  .chart-wrap { height:220px !important; }
  .chart-wrap canvas { max-height:220px !important; }

  /* stat-row 박스 최소폭 제거 */
  .stat-box { min-width:80px; }

  /* 탭 버튼 작게 */
  .tab { padding:6px 10px; font-size:11px; }

  /* 프로필 버튼 영역 */
  .profile { gap:12px; }
  .profile > div[style*="margin-left:auto"] { margin-left:0 !important; width:100%; }

  /* 자기주도 강점/약점 2열 → 1열 */
  #sdlStrengthWeak { grid-template-columns:1fr !important; }

  /* 흥미유형 해석 2열 → 1열 */
  #sdlInterpretations [style*="grid-template-columns:1fr 1fr"] { grid-template-columns:1fr !important; }

  /* 모달 */
  .modal { padding:18px; }
}

/* CARDS */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
.card-title { font-size:13px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:1px; margin-bottom:14px; display:flex; align-items:center; gap:6px; }
.card-title span { font-size:15px; }

/* STUDENT PROFILE */
.profile { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.profile-avatar { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:900; color:#fff; flex-shrink:0; }
.profile-info h2 { font-size:22px; font-weight:700; margin-bottom:4px; }
.profile-info p { font-size:13px; color:var(--text2); }
.profile-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.tag { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.tag-type { background:rgba(108,99,255,.15); color:var(--accent); border:1px solid rgba(108,99,255,.3); }
.tag-interest { background:rgba(0,212,170,.12); color:var(--accent2); border:1px solid rgba(0,212,170,.3); }
.tag-warn { background:rgba(245,158,11,.12); color:var(--warn); border:1px solid rgba(245,158,11,.3); }

/* STAT BOXES */
.stat-row { display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
.stat-box { background:var(--surface2); border-radius:8px; padding:10px 14px; flex:1; min-width:100px; }
.stat-box .label { font-size:10px; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
.stat-box .value { font-size:20px; font-weight:700; margin-top:2px; }
.stat-box .value.high { color:var(--accent2); }
.stat-box .value.mid { color:var(--warn); }
.stat-box .value.low { color:var(--accent3); }

/* INNER GRID */
.inner-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }

/* CHART CONTAINERS */
.chart-wrap { position:relative; height:280px; }
.chart-wrap canvas { max-height:280px; }

/* TIMELINE */
.timeline { display:flex; flex-direction:column; gap:12px; max-height:400px; overflow-y:auto; }
.timeline::-webkit-scrollbar { width:4px; }
.timeline::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.tl-item { display:flex; gap:12px; align-items:flex-start; }
.tl-dot { width:10px; height:10px; border-radius:50%; margin-top:5px; flex-shrink:0; }
.tl-dot.test { background:var(--accent); }
.tl-dot.counsel { background:var(--accent2); }
.tl-content { flex:1; }
.tl-date { font-size:11px; color:var(--text2); }
.tl-title { font-size:13px; font-weight:600; margin:2px 0; }
.tl-desc { font-size:12px; color:var(--text2); line-height:1.5; }

/* PASTE MODE */
.paste-area { width:100%; min-height:120px; background:var(--surface2); border:2px dashed var(--border); border-radius:8px; padding:12px; font-size:12px; color:var(--text); font-family:'Consolas',monospace; resize:vertical; outline:none; }
.paste-area:focus { border-color:var(--accent); }
.paste-area::placeholder { color:var(--text2); }

/* TABS */
.tabs { display:flex; gap:2px; margin-bottom:16px; background:var(--surface); border-radius:8px; padding:3px; border:1px solid var(--border); }
.tab { padding:8px 16px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; color:var(--text2); transition:all .2s; border:none; background:none; font-family:inherit; }
.tab.active { background:var(--accent); color:#fff; }
.tab:hover:not(.active) { color:var(--text); background:var(--surface2); }

/* EMPTY STATE */
.empty { text-align:center; padding:60px 20px; color:var(--text2); }
.empty-icon { font-size:48px; margin-bottom:12px; opacity:.4; }
.empty p { font-size:14px; line-height:1.8; }

/* SETTINGS MODAL */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:center; justify-content:center; }
.modal-bg.show { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; max-width:560px; width:90%; max-height:80vh; overflow-y:auto; }
.modal h3 { font-size:16px; font-weight:700; margin-bottom:16px; }
.modal label { display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:4px; margin-top:12px; }
.modal input, .modal textarea { width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; font-size:13px; font-family:inherit; outline:none; }
.modal textarea { min-height:80px; resize:vertical; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }

/* LOADING */
.loading { display:none; align-items:center; gap:8px; }
.loading.show { display:flex; }
.spinner { width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* STUDENT-BU DATA */
.sbu-box { background:var(--surface2); border-radius:8px; padding:14px; font-size:13px; line-height:1.8; color:var(--text); max-height:200px; overflow-y:auto; }

/* PERSONALITY TABLE */
.per-table { width:100%; border-collapse:collapse; font-size:12px; }
.per-table th { background:var(--surface2); color:var(--text2); font-weight:600; padding:6px 10px; text-align:left; border-bottom:1px solid var(--border); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
.per-table td { padding:7px 10px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:middle; }
.per-table tr:last-child td { border-bottom:none; }
.per-table tbody tr:hover td { background:rgba(108,99,255,.06); }
.per-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:700; }
.per-high { background:rgba(0,212,170,.15); color:var(--accent2); }
.per-vhigh { background:rgba(0,212,170,.25); color:var(--accent2); border:1px solid rgba(0,212,170,.4); }
.per-mid  { background:rgba(108,99,255,.12); color:var(--accent); }
.per-low  { background:rgba(245,158,11,.12); color:var(--warn); }
.per-vlow { background:rgba(255,107,107,.15); color:var(--accent3); }
/* 라이트모드 select/input */
body.light-mode select, body.light-mode input[type=number], body.light-mode input[type=text] {
  background: #fff !important; color: #1a1d27 !important; border-color: #d1d5e0 !important;
}
body.light-mode .paste-area { background:#fff !important; color:#1a1d27 !important; border-color:#d1d5e0 !important; }
body.light-mode .tabs { background:#f0f2f7 !important; }
body.light-mode .tab { color:#5a6075 !important; }
body.light-mode .tab.active { background:var(--accent) !important; color:#fff !important; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 2026 창원경일고 인성적성진로자기주도 검사 결과</h1>
  <div class="header-controls">
    <input id="accessPw" type="password" placeholder="교사용 비밀번호" onkeydown="if(event.key==='Enter')handleSearch()" />
    <div style="position:relative;flex:1;min-width:0;">
      <input id="studentQuery" placeholder="학번 또는 이름 입력"
        oninput="onQueryInput()"
        onkeydown="if(event.key==='Enter')handleSearch()"
        autocomplete="off" />
      <!-- 후보 드롭다운 -->
      <div id="candidateList" style="display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:200;max-height:260px;overflow-y:auto;"></div>
    </div>
    <button class="btn btn-primary" onclick="handleSearch()">조회</button>
    <button class="btn btn-secondary" onclick="resetDashboard()" title="초기화">🔄 초기화</button>
    <button class="btn btn-secondary no-print" id="themeBtn" onclick="toggleTheme()" title="다크/라이트 모드 전환">🌙</button>
    <button class="btn btn-secondary no-print" onclick="savePDF()" title="PDF 저장">🖨️ PDF</button>
  </div>
</div>

<div class="main">
  <!-- MODE: EMPTY -->
  <div id="emptyState" class="empty">
    <div class="empty-icon">🔍</div>
    <p>교사용 비밀번호와 학번 또는 이름을 입력한 뒤 <strong>조회</strong>를 클릭하세요.</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none;">

    <!-- ① PROFILE -->
    <div class="card" style="margin-bottom:16px;">
      <div class="profile">
        <div class="profile-avatar" id="avatar">?</div>
        <div class="profile-info">
          <h2 id="pName">-</h2>
          <p id="pMeta">-</p>
          <div class="profile-tags" id="pTags"></div>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-secondary no-print" onclick="exportForAI()">🤖 진로성장리포트 생성</button>
        </div>
      </div>
      <div class="stat-row" id="statRow"></div>
    </div>

    <!-- ② 적성검사 -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title"><span>🎯</span> 적성능력 검사</div>
      <div id="aptitudeSection">
        <!-- 차트(좌) + 수치표(우) -->
        <div class="inner-grid-2">
          <div class="chart-wrap" style="height:300px;"><canvas id="barAptitude"></canvas></div>
          <div id="aptitudeTable"></div>
        </div>
        <!-- 추천직업 -->
        <div id="aptitudeJobs" style="margin-top:14px;"></div>
      </div>
    </div>

    <!-- ③ 흥미유형 -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title"><span>🎨</span> 흥미유형 (Holland)</div>
      <div class="inner-grid-2">
        <div class="chart-wrap" style="height:300px;"><canvas id="radarHolland"></canvas></div>
        <div id="interestDetail"></div>
      </div>

// ============ THEME ============
function toggleTheme() {
  isDark = !isDark;

  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('dash_theme', isDark ? 'dark' : 'light');
  // 차트 색상 업데이트
  if(currentStudent) {
    const gridCol = isDark ? '#2e3347' : '#e2e5ef';
    const tickCol = isDark ? '#8b90a5' : '#5a6075';
    const labelCol = isDark ? '#e4e7f1' : '#1a1d27';
    Object.values(charts).forEach(ch => {
      if(!ch?.options) return;
      const sc = ch.options.scales || {};
      ['x','y','r'].forEach(k => {
        if(!sc[k]) return;
        if(sc[k].grid) sc[k].grid.color = gridCol;
        if(sc[k].ticks) sc[k].ticks.color = tickCol;
        if(sc[k].pointLabels) sc[k].pointLabels.color = labelCol;
      });
      if(ch.options.plugins?.legend?.labels) ch.options.plugins.legend.labels.color = labelCol;
      ch.update();
    });
  }
}

// ============ PDF SAVE ============
async function savePDF() {
  if(!currentStudent) return alert('먼저 학생 데이터를 로드하세요.');

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  // ── 라이트모드 전환 (공통) ──
  const wasLight = document.body.classList.contains('light-mode');
  const setChartColors = (dark) => {
    const gridCol  = dark ? '#2e3347' : '#e2e5ef';
    const tickCol  = dark ? '#8b90a5' : '#5a6075';
    const labelCol = dark ? '#e4e7f1' : '#1a1d27';
    Object.values(charts).forEach(ch => {
      if(!ch?.options) return;
      const sc = ch.options.scales || {};
      ['x','y','r'].forEach(k => {
        if(!sc[k]) return;
        if(sc[k].grid)        sc[k].grid.color        = gridCol;
        if(sc[k].ticks)       sc[k].ticks.color       = tickCol;
        if(sc[k].pointLabels) sc[k].pointLabels.color = labelCol;
      });
      if(ch.options.plugins?.legend?.labels) ch.options.plugins.legend.labels.color = labelCol;
      ch.update();
    });
  };
  if(!wasLight) { document.body.classList.add('light-mode'); setChartColors(false); }

  // ── PC: 기존 window.print() 방식 ──
  if(!isMobile) {
    const origTitle = document.title;
    if(currentStudent?.student) {
      const s = currentStudent.student;
      document.title = `${s.id}_${s.name}_진로상담`;
    }
    // 차트 캔버스 → PNG 이미지 (인쇄용)
    const chartImgs = [];
    document.querySelectorAll('.chart-wrap').forEach(wrap => {
      const canvas = wrap.querySelector('canvas');
      if(canvas) {
        wrap.querySelectorAll('.print-chart-img').forEach(e => e.remove());
        try {
          const img = document.createElement('img');
          img.className = 'print-chart-img';
          img.src = canvas.toDataURL('image/png');
          img.style.cssText = 'display:none;width:100%;height:220px;object-fit:contain;';
          wrap.appendChild(img);
          chartImgs.push(img);
        } catch(e) {}
      }
    });
    setTimeout(() => {
      window.print();
      chartImgs.forEach(img => img.remove());
      document.title = origTitle;
      if(!wasLight) { document.body.classList.remove('light-mode'); setChartColors(true); }
    }, 400);
    return;
  }

  // ── 모바일: html2canvas + jsPDF ──
  const btn = document.querySelector('[onclick="savePDF()"]');
  const origText = btn ? btn.innerHTML : '';
  if(btn) { btn.innerHTML = '⏳ 생성중...'; btn.disabled = true; }

  const noPrints = document.querySelectorAll('.no-print, .header-controls');
  noPrints.forEach(el => el.style.visibility = 'hidden');

  await new Promise(r => setTimeout(r, 300));

  try {
    const { jsPDF } = window.jspdf;
    // 헤더 + 대시보드 전체 캡처
    const target = document.body;

    const canvas = await html2canvas(target, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false,
      windowWidth: 1200,
      ignoreElements: el => el.classList.contains('no-print') || el.classList.contains('header-controls'),
    });

    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 8;
    const contentW = pageW - margin * 2;
    const imgH = (canvas.height / canvas.width) * contentW;
    const pageContentH = pageH - margin * 2;

    let y = 0;
    while(y < imgH) {
      if(y > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', margin, margin - y, contentW, imgH);
      y += pageContentH;
    }

    const s = currentStudent.student;
    pdf.save(`${s.id}_${s.name}_진로상담.pdf`);

  } catch(e) {
    alert('PDF 생성 중 오류가 발생했습니다.\n' + e.message);
  } finally {
    noPrints.forEach(el => el.style.visibility = '');
    if(!wasLight) { document.body.classList.remove('light-mode'); setChartColors(true); }
    if(btn) { btn.innerHTML = origText; btn.disabled = false; }
  }
}

// ============ 이름 검색 / 학번 검색 통합 ============
let studentList = [];      // 전체 명단 캐시
let listLoaded  = false;   // 명단 로드 여부

// 입력창 변경 시: 이름이면 후보 필터링
function onQueryInput() {
  const q = document.getElementById('studentQuery').value.trim();
  if (!q || /^\d/.test(q)) { hideCandidates(); return; }
  showCandidates(filterByName(q));
}

// 이름으로 명단 필터
function filterByName(name) {
  return studentList.filter(s => s.name.includes(name));
}

// 후보 드롭다운 표시
function showCandidates(list) {
  const box = document.getElementById('candidateList');
  if (!list.length) { hideCandidates(); return; }
  box.innerHTML = list.map(s =>
    `<div onclick="selectCandidate('${s.id}')"
      style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;transition:background .15s;"
      onmouseenter="this.style.background='rgba(108,99,255,.12)'"
      onmouseleave="this.style.background=''">
      <span style="font-weight:700;color:var(--text);">${s.name}</span>
      <span style="color:var(--text2);font-size:12px;margin-left:8px;">${s.grade}학년 ${s.cls}반 ${s.num}번</span>
      <span style="color:var(--accent);font-size:11px;margin-left:6px;">(${s.id})</span>
    </div>`
  ).join('');
  box.style.display = 'block';
}

function hideCandidates() {
  document.getElementById('candidateList').style.display = 'none';
}

// 후보 선택 → 학번으로 바로 조회
function selectCandidate(id) {
  document.getElementById('studentQuery').value = id;
  hideCandidates();
  loadStudentById(id);
}

// 검색창 외부 클릭 시 후보 닫기
document.addEventListener('click', e => {
  if (!e.target.closest('#studentQuery') && !e.target.closest('#candidateList')) hideCandidates();
});

// 조회 버튼 / 엔터 핸들러
async function handleSearch() {
  const pw = document.getElementById('accessPw').value.trim();
  if (!pw) return alert('교사용 비밀번호를 입력하세요.');

  const q = document.getElementById('studentQuery').value.trim();
  if (!q) return alert('학번 또는 이름을 입력하세요.');

  hideCandidates();

  // 숫자 → 학번 직접 조회
  if (/^\d+$/.test(q)) {
    await loadStudentById(q);
    return;
  }

  // 이름 → 명단에서 검색
  const ok = await ensureStudentList(pw);
  if (!ok) return;

  const found = filterByName(q);

  if (found.length === 0) {
    alert(`"${q}" 이름의 학생을 찾을 수 없습니다.`);
  } else if (found.length === 1) {
    document.getElementById('studentQuery').value = found[0].id;
    await loadStudentById(found[0].id);
  } else {
    showCandidates(found);
  }
}

// 전체 명단 1회 로딩 (비밀번호 인증 포함)
async function ensureStudentList(pw) {
  if (listLoaded) return true;
  try {
    const res  = await fetch(`${GAS_URL}?action=getStudentList&pw=${encodeURIComponent(pw)}`);
    const data = await res.json();
    if (data.error) {
      alert('명단 조회 실패: ' + data.error + '\n\nGAS를 최신 버전으로 재배포했는지 확인하세요.');
      return false;
    }
    studentList = data.students || [];
    listLoaded  = true;
    return true;
  } catch(e) {
    alert('명단 로드 실패: ' + e.message);
    return false;
  }
}

// 학번으로 학생 데이터 조회
async function loadStudentById(sid) {
  const pw = document.getElementById('accessPw').value.trim();
  if (!pw) return alert('교사용 비밀번호를 입력하세요.');
  try {
    const res  = await fetch(`${GAS_URL}?action=getStudent&id=${encodeURIComponent(sid)}&pw=${encodeURIComponent(pw)}`);
    const data = await res.json();
    if (data.error) return alert(data.error);
    renderDashboard(data);
  } catch(e) {
    alert('데이터 로드 실패: ' + e.message);
  }
}

// 기존 호환
async function loadStudent() { await handleSearch(); }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  currentStudent = d;

  const s = d.student || {};
  document.getElementById('avatar').textContent = (s.name || '?')[0];
  document.getElementById('pName').textContent = s.name || '-';
  document.getElementById('pMeta').textContent = `${s.grade || '-'}학년 ${s.cls || '-'}반 ${s.num || '-'}번 | 학번: ${s.id || '-'}`;

  // Tags
  const tags = document.getElementById('pTags');
  tags.innerHTML = '';
  if(d.interest?.code1) addTag(tags, d.interest.code1, 'tag-interest');
  if(d.personality?.dept) addTag(tags, '희망계열: ' + d.personality.dept, 'tag-type');
  if(d.personality?.job) addTag(tags, '희망직업: ' + d.personality.job, 'tag-type');
  if(d.aptitude?.jobs?.length) d.aptitude.jobs.slice(0,3).forEach(j => j && addTag(tags, '추천: '+j.trim(), 'tag-interest'));
  const sd = d.selfDirected || {};
  const sdHasData = Object.values(sd).some(v => v > 0);

  // Stats
  const statRow = document.getElementById('statRow');
  statRow.innerHTML = '';
  const sdVals = Object.values(sd).filter(v=>v>0);
  if(sdVals.length>0){const avg=Math.round(sdVals.reduce((a,b)=>a+b,0)/sdVals.length);addStat(statRow,'자기주도 평균',avg+'점',avg>=55?'high':avg>=40?'mid':'low');}
  if(d.career?.cm?.t) addStat(statRow,'진로성숙도',d.career.cm.t+'점',+d.career.cm.t>=55?'high':+d.career.cm.t>=40?'mid':'low');
  if(d.aptitude?.scores?.length){const maxApt=d.aptitude.scores.reduce((a,b)=>+a.score>+b.score?a:b);addStat(statRow,'최고 적성',maxApt.name,'high');}
  if(d.interest?.code1) addStat(statRow,'1순위 흥미',d.interest.code1.split(' ')[0],'high');
  if(d.personality?.peer) addStat(statRow,'또래관계',d.personality.peer,'high');

  // Render all sections
  renderAptitude(d.aptitude || {});
  renderInterest(d.interest || {});
  renderPersonality(d.personality || {});
  renderCareer(d.career || {});
  renderSDL(d.sdlNarrative || {});
}

// ============ HELPERS ============
function addTag(container, text, cls) {
  const t = document.createElement('span');
  t.className = 'tag ' + cls; t.textContent = text; container.appendChild(t);
}
function addStat(container, label, value, cls) {
  const box = document.createElement('div');
  box.className = 'stat-box';
  box.innerHTML = `<div class="label">${label}</div><div class="value ${cls}">${value}</div>`;
  container.appendChild(box);
}
function levelColor(lv) {
  if(!lv) return 'var(--text2)';
  if(lv.includes('최상')||lv.includes('매우높')||lv.includes('매우좋')) return '#00d4aa';
  if(lv.includes('상')||lv.includes('높')||lv.includes('좋')) return '#6c63ff';
  if(lv.includes('중상')) return '#3b82f6';
  if(lv.includes('중하')) return '#f59e0b';
  if(lv.includes('하')||lv.includes('낮')||lv.includes('나쁨')) return '#ff6b6b';
  if(lv.includes('최하')||lv.includes('매우낮')) return '#e53e3e';
  return 'var(--accent)';
}
function levelBadge(lv) {
  if(!lv) return '<span style="color:var(--text2);">-</span>';
  const c = levelColor(lv);
  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:${c}22;color:${c};border:1px solid ${c}55;">${lv}</span>`;
}
// 가로 막대 (레이블 + 바 + 수치 + 수준뱃지)
function scorBar(name, score, max, lv, color) {
  const pct = Math.min(100, Math.round((score/max)*100));
  const barColor = color || levelColor(lv);
  return `<div style="margin-bottom:10px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">
      <span style="font-size:12px;font-weight:600;color:var(--text);">${name}</span>
      <span style="display:flex;align-items:center;gap:6px;">${levelBadge(lv)}<span style="font-size:13px;font-weight:700;color:${barColor};">${score}</span></span>
    </div>
    <div style="background:#e8eaf0;border-radius:4px;height:8px;overflow:hidden;">
      <div style="height:100%;width:${pct}%;background:${barColor};border-radius:4px;transition:width .4s;print-color-adjust:exact;-webkit-print-color-adjust:exact;"></div>
    </div>
  </div>`;
}

// ============ CHART HELPERS ============
function destroyChart(key) { if(charts[key]) { charts[key].destroy(); delete charts[key]; } }
function gc() { return isDark ? '#2e3347' : '#e2e5ef'; }
function tc() { return isDark ? '#8b90a5' : '#5a6075'; }
function lc() { return isDark ? '#e4e7f1' : '#1a1d27'; }

// ============ ② 적성검사 ============
function renderAptitude(apt) {
  destroyChart('barAptitude');
  const scores = apt.scores || [];
  if(!scores.length) { document.getElementById('aptitudeSection').innerHTML = '<p style="font-size:13px;color:var(--text2);">적성 데이터 없음</p>'; return; }

  // 우측 수치표
  const tableEl = document.getElementById('aptitudeTable');
  const max = 160;
  tableEl.innerHTML = scores.map(s => scorBar(s.name, +s.score, max, s.level, levelColor(s.level))).join('');

  // 차트 (수평 바)
  const colors = scores.map(s => levelColor(s.level));
  charts.barAptitude = new Chart(document.getElementById('barAptitude'), {
    type: 'bar',
    data: {
      labels: scores.map(s => s.name),
      datasets: [{
        data: scores.map(s => +s.score),
        backgroundColor: colors.map(c => c+'99'),
        borderColor: colors,
        borderWidth: 2,
        borderRadius: 5,
        barThickness: 22
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: 'y',
      scales: {
        x: { min: 70, max: 140, grid: { color: gc() }, ticks: { color: tc(), stepSize: 10 } },
        y: { grid: { display: false }, ticks: { color: lc(), font: { size: 11, family: 'Noto Sans KR' } } }
      },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          label: ctx => ` ${ctx.raw}점`,
          afterLabel: ctx => `수준: ${scores[ctx.dataIndex].level}`
        }}
      }
    }
  });

  // 추천직업
  const jobsEl = document.getElementById('aptitudeJobs');
  if(apt.jobs?.length) {
    jobsEl.innerHTML = `<div style="background:var(--surface2);border-radius:8px;padding:12px;">
      <div style="font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px;margin-bottom:8px;">🏆 추천 직업 (적성 기반)</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">${apt.jobs.map(j=>`<span style="padding:4px 12px;border-radius:20px;font-size:12px;background:rgba(108,99,255,.15);color:var(--accent);border:1px solid rgba(108,99,255,.3);">${j}</span>`).join('')}</div>
    </div>`;
  } else { jobsEl.innerHTML = ''; }
}

// ============ ③ 흥미유형 ============
function renderInterest(interest) {
  destroyChart('radarHolland');
  const types = interest.types || [];

  // 우측 상세
  const detailEl = document.getElementById('interestDetail');
  if(types.length) {
    const order = ['R','I','A','S','E','C'];
    const nameMap = {R:'현실형',I:'탐구형',A:'예술형',S:'사회형',E:'진취형',C:'관습형'};
    const sorted = order.map(c => types.find(t=>t.code===c)||{code:c,name:nameMap[c],t:0,lv:'-'});

    // 고유형/저유형
    const sorted2 = [...types].sort((a,b)=>b.t-a.t);
    const top = sorted2.slice(0,2).map(t=>`${t.name}(${t.code})`).join(', ');
    const bot = sorted2.slice(-2).map(t=>`${t.name}(${t.code})`).join(', ');

    detailEl.innerHTML = `
      <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;">
        ${interest.code1 ? `<span style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(0,212,170,.15);color:var(--accent2);border:1px solid rgba(0,212,170,.4);">1순위 ${interest.code1}</span>` : ''}
        ${interest.code2 ? `<span style="padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(108,99,255,.15);color:var(--accent);border:1px solid rgba(108,99,255,.4);">2순위 ${interest.code2}</span>` : ''}
      </div>
      ${sorted.map(t => {
        const pct = Math.min(100, Math.round(((+t.t-30)/50)*100));
        const c = levelColor(t.lv);
        return `<div style="margin-bottom:9px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">
            <span style="font-size:12px;font-weight:600;">${t.name}(${t.code})</span>
            <span style="display:flex;align-items:center;gap:5px;">${levelBadge(t.lv)}<span style="font-size:13px;font-weight:700;color:${c};">T=${t.t}</span></span>
          </div>
          <div style="background:var(--surface2);border-radius:4px;height:7px;overflow:hidden;">
            <div style="height:100%;width:${Math.max(0,pct)}%;background:${c};border-radius:4px;"></div>
          </div>
        </div>`;
      }).join('')}
      <div style="margin-top:10px;font-size:11px;color:var(--text2);">
        <span style="color:var(--accent2);">▲ 고유형:</span> ${interest.hi||top} &nbsp;|&nbsp; <span style="color:var(--accent3);">▼ 저유형:</span> ${interest.lo||bot}
      </div>`;

    // 레이더 차트
    const vals = sorted.map(t=>+t.t||0);
    charts.radarHolland = new Chart(document.getElementById('radarHolland'), {
      type: 'radar',
      data: {
        labels: sorted.map(t=>`${t.name}(${t.code})`),
        datasets: [{
          label: 'T점수', data: vals,
          backgroundColor: 'rgba(0,212,170,.12)', borderColor: '#00d4aa', borderWidth: 2,
          pointBackgroundColor: vals.map((_,i) => i<2 ? '#00d4aa' : '#6c63ff'),
          pointRadius: 5
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { r: { min: 30, max: 70, ticks: { stepSize: 10, color: tc(), backdropColor: 'transparent', font:{size:10} }, grid: { color: gc() }, pointLabels: { color: lc(), font: { size: 11, family: 'Noto Sans KR' } } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  // 추천직업
  const jobsEl = document.getElementById('interestJobs');
  if(interest.jobs) {
    const jobArr = interest.jobs.split(',').map(j=>j.trim()).filter(Boolean);
    jobsEl.innerHTML = `<div style="background:var(--surface2);border-radius:8px;padding:12px;">
      <div style="font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px;margin-bottom:8px;">🎨 추천 직업 (흥미 기반)</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">${jobArr.map(j=>`<span style="padding:3px 10px;border-radius:20px;font-size:11px;background:rgba(0,212,170,.1);color:var(--accent2);border:1px solid rgba(0,212,170,.25);">${j}</span>`).join('')}</div>
    </div>`;
  } else { jobsEl.innerHTML = ''; }
}

// ============ ④ 성격특성 ============
function renderPersonality(p) {
  const section = document.getElementById('personalitySection');
  const big5Keys = ['ext','agr','con','ope','neu'];
  const big5Names = {ext:'외향성',agr:'친화성(우호성)',con:'성실성',ope:'개방성',neu:'신경성(정서불안정)'};
  const big5Desc  = {ext:'활동성·사교성·적극성',agr:'협동심·배려·공감',con:'계획성·책임감·꼼꼼함',ope:'창의성·호기심·개방적 사고',neu:'감정 민감도 (높을수록 불안정)'};
  const adaptKeys = ['ssat','sadp','peer','grade'];
  const adaptNames= {ssat:'학교적응',sadp:'사회적응',peer:'또래관계',grade:'학업수준'};

  const hasBig5 = big5Keys.some(k=>p[k]);
  const hasAdapt = adaptKeys.some(k=>p[k]);
  const hasExtra = p.fav||p.bad||p.dept||p.job;

  if(!hasBig5 && !hasAdapt && !hasExtra) { section.style.display='none'; return; }
  section.style.display = 'block';

  // Big5 가로 막대형
  const big5El = document.getElementById('big5Bars');
  if(hasBig5) {
    big5El.innerHTML = big5Keys.map(k => {
      const lv = p[k];
      if(!lv) return '';
      const lvNum = {매우낮음:1,낮음:2,보통:3,높음:4,매우높음:5}[lv]||3;
      const pct = (lvNum/5)*100;
      const c = levelColor(lv);
      return `<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
          <span style="font-size:12px;font-weight:600;">${big5Names[k]}</span>
          <span style="display:flex;align-items:center;gap:5px;">${levelBadge(lv)}</span>
        </div>
        <div style="font-size:10px;color:var(--text2);margin-bottom:4px;">${big5Desc[k]}</div>
        <div style="background:var(--surface2);border-radius:4px;height:7px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:${c};border-radius:4px;"></div>
        </div>
      </div>`;
    }).join('');
  } else { big5El.innerHTML = '<p style="font-size:12px;color:var(--text2);">데이터 없음</p>'; }

  // 희망·선호 정보
  const extraEl = document.getElementById('personalityExtra');
  const extraRows = [
    p.dept && ['희망계열',p.dept],
    p.job  && ['희망직업',p.job],
    p.fav  && ['선호과목',p.fav],
    p.bad  && ['기피과목',p.bad],
  ].filter(Boolean);
  extraEl.innerHTML = extraRows.map(([k,v])=>`
    <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:7px;">
      <span style="font-size:11px;font-weight:700;color:var(--text2);white-space:nowrap;min-width:56px;">${k}</span>
      <span style="font-size:12px;color:var(--text);line-height:1.5;">${v}</span>
    </div>`).join('') || '<p style="font-size:12px;color:var(--text2);">입력 없음</p>';

  // 학교적응
  const adaptEl = document.getElementById('schoolAdapt');
  if(hasAdapt) {
    adaptEl.innerHTML = adaptKeys.map(k=>{
      const lv = p[k]; if(!lv) return '';
      const lvNum = {매우낮음:1,나쁨:1,낮음:2,보통:3,높음:4,좋음:4,매우높음:5,매우좋음:5}[lv]||3;
      const pct=(lvNum/5)*100; const c=levelColor(lv);
      return `<div style="margin-bottom:9px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
          <span style="font-size:12px;font-weight:600;">${adaptNames[k]}</span>${levelBadge(lv)}
        </div>
        <div style="background:var(--surface2);border-radius:4px;height:7px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:${c};border-radius:4px;"></div>
        </div>
      </div>`;
    }).join('');
  } else { adaptEl.innerHTML = '<p style="font-size:12px;color:var(--text2);">데이터 없음</p>'; }
}

// ============ ⑤ 진로성숙도 & 진로장벽 ============

  const cmEl = document.getElementById('careerMaturityBars');

  if(cm.t) {
    const c = levelColor(cm.lv);
    cmHtml += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;background:var(--surface2);border-radius:8px;">
      <span style="font-size:22px;font-weight:900;color:${c};">${cm.t}</span>
      <div><div style="font-size:10px;color:var(--text2);">종합점수</div>${levelBadge(cm.lv)}</div>
    </div>`;

    cmHtml += cm.subs.map(s => scorBar(s.name, +s.sc, 80, s.lv, levelColor(s.lv))).join('');
  }
  cmEl.innerHTML = cmHtml || '<p style="font-size:12px;color:var(--text2);">데이터 없음</p>';

  // 진로장벽

    cdHtml += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;background:var(--surface2);border-radius:8px;">
      <span style="font-size:22px;font-weight:900;color:${c};">${cd.sc}</span>
      <div><div style="font-size:10px;color:var(--text2);">종합점수</div>${levelBadge(cd.lv)}</div>
    </div>`;

    cdHtml += cd.subs.map(s => scorBar(s.name, +s.sc, 80, s.lv, levelColor(s.lv))).join('');
  }
  cdEl.innerHTML = cdHtml || '<p style="font-size:12px;color:var(--text2);">데이터 없음</p>';

  // 진로 생각/계획
  const thoughtEl = document.getElementById('careerThought');
  if(career.thought || career.plan) {
    thoughtEl.innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      ${career.thought ? `<div style="background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.2);border-radius:8px;padding:12px;">
        <div style="font-size:10px;font-weight:700;color:var(--accent2);letter-spacing:.5px;margin-bottom:6px;">💭 진로에 대한 생각</div>
        <div style="font-size:13px;color:var(--text);line-height:1.7;">${career.thought}</div>
      </div>` : ''}
      ${career.plan ? `<div style="background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.2);border-radius:8px;padding:12px;">
        <div style="font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:6px;">📌 노력할 점 / 계획</div>
        <div style="font-size:13px;color:var(--text);line-height:1.7;">${career.plan}</div>
      </div>` : ''}
    </div>`;
  } else { thoughtEl.innerHTML = ''; }

  // 구버전 호환: barCareer canvas가 있으면 숨김
  const old = document.getElementById('barCareer');
  if(old) old.closest('.card') && (old.style.display='none');
}

// ============ ⑥ 자기주도학습 ============
function renderSDL(narr={}) {
  destroyChart('radarSelf');
  destroyChart('lineGrowth');

  const labels = ['학습계획','학습실행','학습평가','학습효능감','학습메타인지'];

  const canvas = document.getElementById('radarSelf');
  const wrap = canvas.parentElement;
  wrap.querySelectorAll('.sdl-empty').forEach(e=>e.remove());
  if(!hasData) {
    canvas.style.display = 'none';
    const msg = document.createElement('div');
    msg.className = 'sdl-empty';
    msg.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:8px;';

    document.getElementById('sdlScoreTable').innerHTML = '';
    document.getElementById('sdlInterpretations').innerHTML = '';
    document.getElementById('sdlStrengthWeak').innerHTML = '';
    return;
  }
  canvas.style.display = '';
  charts.radarSelf = new Chart(canvas, {
    type: 'radar',
    data: { labels, datasets: [{ label: '점수', data: values,
      backgroundColor: 'rgba(108,99,255,.15)', borderColor: '#6c63ff', borderWidth: 2,

      responsive: true, maintainAspectRatio: false,

      plugins: { legend: { display: false } }

  });

  // 점수 표 (우측) — 유형 라벨 제거, 점수만 표시
  const total = values.reduce((a,b)=>a+b,0);

    <div style="background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">

      </div>
      ${labels.map((l,i) => {
        const v = values[i];
        const bpct = Math.round((v/80)*100);
        return `<div style="margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
            <span style="font-size:12px;font-weight:600;">${l}</span>
            <span style="font-size:13px;font-weight:700;">${v}점</span>
          </div>
          <div style="background:var(--bg);border-radius:4px;height:6px;overflow:hidden;">
            <div style="height:100%;width:${bpct}%;background:var(--accent);border-radius:4px;"></div>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  // 영역별 서술 해석 — 구글시트(RAW_자기주도_서술)의 실제 데이터 표시
  const hasNarr = labels.some(l => narr[l]);
  document.getElementById('sdlInterpretations').innerHTML = hasNarr ? `
    <div style="font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px;margin-bottom:10px;">● 영역별 해석</div>
    <div class="inner-grid-2" style="gap:10px;">
      ${labels.map(l => {
        const txt = narr[l] || '';
        if(!txt) return '';
        return `<div style="background:var(--surface2);border-radius:8px;padding:12px;">
          <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;">${l} 해석 <span style="font-size:11px;font-weight:400;color:var(--text2);">${sd[l]||''}점</span></div>
          <div style="font-size:12px;color:var(--text);line-height:1.7;">${txt}</div>
        </div>`;
      }).filter(Boolean).join('')}
    </div>` : '';

  // 학습 강점/약점 — 구글시트 실제 데이터
  const hasStrWeak = narr.학습강점 || narr.학습약점;
  document.getElementById('sdlStrengthWeak').innerHTML = hasStrWeak ? `
    <div style="background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.2);border-radius:8px;padding:12px;">
      <div style="font-size:11px;font-weight:700;color:var(--accent2);margin-bottom:6px;">💪 나의 학습 강점</div>
      <div style="font-size:12px;color:var(--text);line-height:1.8;">${narr.학습강점 || '데이터 없음'}</div>
    </div>
    <div style="background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);border-radius:8px;padding:12px;">
      <div style="font-size:11px;font-weight:700;color:var(--accent3);margin-bottom:6px;">⚠ 나의 학습 약점</div>
      <div style="font-size:12px;color:var(--text);line-height:1.8;">${narr.학습약점 || '데이터 없음'}</div>
    </div>` : '';

  // 종합의견
  if(narr.종합의견) {
    document.getElementById('sdlStrengthWeak').insertAdjacentHTML('afterend', `
    <div style="margin-top:12px;background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.2);border-radius:8px;padding:12px;">
      <div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:6px;">📊 종합 해석</div>
      <div style="font-size:12px;color:var(--text);line-height:1.8;">${narr.종합의견}</div>
    </div>`);
  }
}

function renderRadarHolland(types) { /* handled by renderInterest */ }

// ============ TIMELINE ============
// ============ EXPORT FOR AI ============
function exportForAI() {
  if(!currentStudent) return alert('먼저 학생 데이터를 로드하세요.');
  const d = currentStudent;
  const s = d.student || {};

  const prompt = `다음은 고등학교 학생의 5종 검사 결과와 상담 기록입니다.
성장 리포트를 작성해주세요:
1. 학생 프로필 요약 (강점 중심)
2. 5종 검사 종합 분석 (적성-흥미 연계, 인성-자기주도 연계)
3. 주요 발견점 (교차 분석 인사이트)
4. 진로 방향 제안 (2~3개)
5. 상담 후속 조치 제안

───────────────────────────────────`;

  let text = prompt + '\n\n';
  text += `=== 학생 진로상담 데이터 ===\n`;
  text += `이름: ${s.name} | ${s.grade}학년 ${s.cls}반 ${s.num}번 | 학번: ${s.id}\n\n`;

  // 자기주도학습
  const sd = d.selfDirected || {};
  const sdKeys = ['학습계획','학습실행','학습평가','학습효능감','학습메타인지'];
  const hasSD = sdKeys.some(k => sd[k]);
  if(hasSD) {
    text += `[자기주도학습검사]\n`;
    sdKeys.forEach(k => { if(sd[k]) text += `  ${k}: ${sd[k]}점\n`; });
    const avg = Math.round(sdKeys.filter(k=>sd[k]).reduce((a,k)=>a+sd[k],0) / sdKeys.filter(k=>sd[k]).length);
    text += `  평균: ${avg}점\n`;
    const narr = d.sdlNarrative || {};
    if(narr.학습강점) text += `  학습강점: ${narr.학습강점}\n`;
    if(narr.학습약점) text += `  학습약점: ${narr.학습약점}\n`;
    if(narr.종합의견) text += `  종합의견: ${narr.종합의견}\n`;
    text += '\n';
  } else {
    text += `[자기주도학습검사] 데이터 없음\n\n`;
  }

  // 적성검사
  if(d.aptitude?.scores?.length) {
    text += `[적성검사]\n`;
    d.aptitude.scores.forEach(s => text += `  ${s.name}: ${s.score}점 (${s.level})\n`);
    if(d.aptitude.jobs?.length) text += `  추천직업: ${d.aptitude.jobs.join(', ')}\n`;
    text += '\n';
  }

  // 인성검사
  const p = d.personality || {};
  const pMap = {ext:'외향성',agr:'우호성',con:'성실성',ope:'개방성',neu:'정서적안정',ssat:'학교적응',sadp:'사회적응',peer:'또래관계',grade:'학업수준'};
  const hasPer = Object.keys(pMap).some(k => p[k]) || p.fav || p.bad || p.dept || p.job;
  if(hasPer) {
    text += `[인성검사]\n`;
    Object.entries(pMap).forEach(([k,v]) => { if(p[k]) text += `  ${v}: ${p[k]}\n`; });
    if(p.fav)  text += `  선호과목: ${p.fav}\n`;
    if(p.bad)  text += `  비선호과목: ${p.bad}\n`;
    if(p.dept) text += `  희망계열: ${p.dept}\n`;
    if(p.job)  text += `  희망직업: ${p.job}\n`;
    text += '\n';
  } else {
    text += `[인성검사] 데이터 없음\n\n`;
  }

  // 흥미검사
  if(d.interest?.types?.length) {
    text += `[흥미검사] 1순위: ${d.interest.code1 || '-'}, 2순위: ${d.interest.code2 || '-'}\n`;
    d.interest.types.forEach(t => text += `  ${t.name}(${t.code}): T=${t.t} (${t.lv})\n`);
    if(d.interest.hi) text += `  가장높은흥미분야: ${d.interest.hi}\n`;
    if(d.interest.lo) text += `  가장낮은흥미분야: ${d.interest.lo}\n`;
    if(d.interest.jobs) text += `  흥미추천직업: ${d.interest.jobs}\n`;
    text += '\n';
  }

  // 진로성숙도
  if(d.career?.cm?.subs?.length) {
    text += `[진로성숙도] 전체: ${d.career.cm.t}점 (${d.career.cm.lv})\n`;
    d.career.cm.subs.forEach(s => text += `  ${s.name}: ${s.sc}점 (${s.lv})\n`);
    text += '\n';
  }

  // 진로결정
  if(d.career?.cd?.subs?.length) {
    text += `[진로결정갈등] 전체: ${d.career.cd.sc}점 (${d.career.cd.lv})\n`;
    d.career.cd.subs.forEach(s => text += `  ${s.name}: ${s.sc}점 (${s.lv})\n`);
    text += '\n';
  }

  if(d.career?.thought) text += `[진로에 대한 생각] ${d.career.thought}\n`;
  if(d.career?.plan)    text += `[노력할 점] ${d.career.plan}\n\n`;

  // 상담기록
  if(d.counseling?.length) {
    text += `[상담기록]\n`;
    d.counseling.forEach(c => text += `  ${c.date} | ${c.title}: ${c.desc}\n`);
    text += '\n';
  }

  navigator.clipboard.writeText(text).then(() => {
    alert('✅ AI 리포트용 데이터가 클립보드에 복사되었습니다.\n\nClaude 또는 ChatGPT에 붙여넣기하세요.\n(프롬프트가 데이터 위에 포함되어 있습니다.)');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    alert('✅ AI 리포트용 데이터가 클립보드에 복사되었습니다.');
  });
}
</script>
